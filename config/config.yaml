# WeatherNext Pro — Configuration
# Polymarket temperature prediction using WeatherNext 2 forecasts

weather_api:
  base_url: "https://weather.googleapis.com/v1"
  api_key: "${GMAPS_API_KEY}"

scanner:
  interval_minutes: 30         # how often to scan Polymarket for opportunities
  request_delay: 0.3           # seconds between API calls (rate limiting)
  ensemble_weight: 0.5         # 0=Google only, 1=Ensemble only, 0.5=equal blend

trading:
  paper_trading: true          # set to false for live trading
  require_2fa: true
  min_edge_pct: 25.0           # only trade if our prob differs from market by >25%
  no_only: true                # NO-only strategy: skip BUY_YES (backtest: YES=8% hit, NO=71% hit)
  max_position_usdc: 20.0      # max $20 per trade

polymarket:
  api_key: "${POLYMARKET_API_KEY}"
  api_secret: "${POLYMARKET_API_SECRET}"
  clob_url: "https://clob.polymarket.com"
  gamma_url: "https://gamma-api.polymarket.com"

telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"

risk_management:
  max_position_size: 500
  max_daily_loss: 100
  max_total_exposure: 2000
  max_trades_per_day: 20
  min_confidence: 0.60
  max_spread_pct: 5.0
  circuit_breaker_cooldown_seconds: 3600
